name: GitGuardian secret scan

# Always-on ggshield on PRs and main. Fails closed when GITGUARDIAN_API_KEY is
# missing — never skip silently. Never echo the secret.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitguardian-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      - name: Require GitGuardian API key
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::GITGUARDIAN_API_KEY is not set in repository secrets."
            echo "Add GITGUARDIAN_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan (ggshield)
        # Official Action path shipped by GitGuardian (ggshield-action / monorepo secret action).
        uses: GitGuardian/ggshield/actions/secret@v1.54.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
