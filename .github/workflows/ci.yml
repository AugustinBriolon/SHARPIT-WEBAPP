name: CI

# Typecheck and every package's tests, on each push and pull request. The presentation
# architecture guard is one of those tests.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_MAP.md'
      - 'FEATURE_EXTRACTION.md'
      - '**/*.md'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install OS dependencies (sharp/prisma)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ libvips-dev

      # Prisma Client generate is incompatible with Yarn PnP autoinstall and
      # recurses into yarn install (postinstall → prisma generate → yarn add → …)
      # until the runner SIGTERMs the job (exit 143). Use node-modules for this job.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            .yarn/cache
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install (immutable)
        run: yarn install --immutable
        env:
          YARN_NODE_LINKER: node-modules
          PRISMA_GENERATE_SKIP_AUTOINSTALL: '1'

      - name: Generate Prisma Client
        run: yarn web prisma generate
        env:
          YARN_NODE_LINKER: node-modules
          PRISMA_GENERATE_SKIP_AUTOINSTALL: '1'

      - name: Typecheck
        run: yarn typecheck
        env:
          YARN_NODE_LINKER: node-modules

      - name: Run tests
        run: yarn test
        env:
          YARN_NODE_LINKER: node-modules

      - name: Coach offline evals
        run: |
          yarn api eval:coach-memory
          yarn api eval:weekly-brief
          yarn api eval:coach-prompt-improve
        env:
          YARN_NODE_LINKER: node-modules
